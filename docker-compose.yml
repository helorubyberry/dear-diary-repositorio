version: '3.8'

networks:
  rede_https:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.10.0/24

services:
  servidor_web:
    image: nginx:alpine
    container_name: servidor_web_dear_diary
    ports:
      - "80:80"
      - "443:443"
    networks:
      rede_https:
        ipv4_address: 172.20.10.10
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - .:/usr/share/nginx/html:ro

  cliente_teste:
    image: alpine:latest
    container_name: cliente_teste
    command: tail -f /dev/null
    networks:
      rede_https:
        ipv4_address: 172.20.10.20